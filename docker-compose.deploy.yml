# Minimal deploy for NutriTrack backend (microservices + gateway only).
# - No frontend (port 80 belongs to the host Caddy).
# - No libretranslate (nevo runs with LIBRETRANSLATE_ENABLED=false).
# - All services on compose_hermes-net so the host Caddy can reach the gateway.
# - Memory-capped for a small host (3.7 GiB total).
networks:
  hermes:
    external: true
    name: compose_hermes-net

services:
  postgres:
    build: ./infra/postgres
    environment:
      POSTGRES_USER: nutritrack
      POSTGRES_PASSWORD: nutritrack
      POSTGRES_DB: postgres
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutritrack"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    networks: [hermes]

  redis:
    build: ./infra/redis
    mem_limit: 128m
    networks: [hermes]

  auth-service:
    build: ./services/auth-service
    environment:
      PORT: 8080
      AUTH_MODE: ${AUTH_MODE:-dev}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      USER_SERVICE_URL: http://user-profile-service:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      JWT_ISSUER: http://auth-service
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 14d
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      user-profile-service:
        condition: service_started
    mem_limit: 384m
    networks: [hermes]

  user-profile-service:
    build: ./services/user-profile-service
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users
      SPRING_DATASOURCE_USERNAME: nutritrack
      SPRING_DATASOURCE_PASSWORD: nutritrack
      JWKS_URI: http://auth-service:8080/.well-known/jwks.json
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    networks: [hermes]

  food-catalog-service:
    build: ./services/food-catalog-service
    # Needs extra headroom for Spring Batch context init (realistic peak ~500M).
    mem_limit: 600m
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/food_catalog
      SPRING_DATASOURCE_USERNAME: nutritrack
      SPRING_DATASOURCE_PASSWORD: nutritrack
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWKS_URI: http://auth-service:8080/.well-known/jwks.json
      OFF_BASE_URL: ${OFF_BASE_URL:-https://world.openfoodfacts.org}
      OFF_USER_AGENT: ${OFF_USER_AGENT:-NutriTrack - Server - Version 0.1}
      FOOD_REDIS_ENABLED: "true"
      ENRICHMENT_ENABLED: ${ENRICHMENT_ENABLED:-true}
      ENRICHMENT_SERVICE_URL: http://nutrient-enrichment-service:8080
      NEVO_SERVICE_URL: http://nevo-service:8080
      NEVO_ESTIMATE_ENABLED: ${NEVO_ESTIMATE_ENABLED:-false}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      auth-service:
        condition: service_started
      nutrient-enrichment-service:
        condition: service_started
      nevo-service:
        condition: service_started
    networks: [hermes]

  nutrient-enrichment-service:
    build: ./services/nutrient-enrichment-service
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/enrichment
      SPRING_DATASOURCE_USERNAME: nutritrack
      SPRING_DATASOURCE_PASSWORD: nutritrack
      FDC_BASE_URL: ${FDC_BASE_URL:-https://api.nal.usda.gov/fdc/v1}
      FDC_API_KEY: ${FDC_API_KEY:-DEMO_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    networks: [hermes]

  nevo-service:
    build: ./services/nevo-service
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nevo
      SPRING_DATASOURCE_USERNAME: nutritrack
      SPRING_DATASOURCE_PASSWORD: nutritrack
      # Empty uses classpath:nevo/NEVO2025_v9.0.csv baked into the JAR.
      NEVO_CSV_PATH: ${NEVO_CSV_PATH:-}
      NEVO_VERSION: ${NEVO_VERSION:-2025/9.0}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      LIBRETRANSLATE_ENABLED: "true"
      LIBRETRANSLATE_URL: http://libretranslate:5000
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      postgres:
        condition: service_healthy
      libretranslate:
        condition: service_started
    mem_limit: 384m
    networks: [hermes]

  libretranslate:
    build: ./services/libretranslate
    environment:
      PORT: 5000
      LT_LOAD_ONLY: en,nl
      LT_UPDATE: "true"
    mem_limit: 768m
    networks: [hermes]

  diary-service:
    build: ./services/diary-service
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/diary
      SPRING_DATASOURCE_USERNAME: nutritrack
      SPRING_DATASOURCE_PASSWORD: nutritrack
      JWKS_URI: http://auth-service:8080/.well-known/jwks.json
      FOOD_SERVICE_URL: http://food-catalog-service:8080
      USER_SERVICE_URL: http://user-profile-service:8080
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      food-catalog-service:
        condition: service_started
      user-profile-service:
        condition: service_started
    mem_limit: 384m
    networks: [hermes]

  gateway:
    build: ./services/gateway
    environment:
      PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8080
      USER_SERVICE_URL: http://user-profile-service:8080
      FOOD_SERVICE_URL: http://food-catalog-service:8080
      DIARY_SERVICE_URL: http://diary-service:8080
      NEVO_SERVICE_URL: http://nevo-service:8080
      RECO_SERVICE_URL: http://recommendation-service:8080
      JWKS_URI: http://auth-service:8080/.well-known/jwks.json
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost}
      SWAGGER_UI_ENABLED: "true"
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      - auth-service
      - user-profile-service
      - food-catalog-service
      - diary-service
      - nevo-service
      - nutrient-enrichment-service
    mem_limit: 384m
    networks: [hermes]

  # Vite dev-mode frontend server. Builds a dev image from source (context is
  # shipped to the daemon via build, avoiding bind-mount host path mismatch),
  # serves the SPA at /app, and proxies /api + /.well-known to the gateway so
  # the browser talks same-origin via Caddy at /calorietracker.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_BASE: /app
      VITE_API_BASE_URL: https://static.128.216.108.65.clients.your-server.de/calorietracker
      VITE_DEV_PROXY_TARGET: http://calorietracker-gateway-1:8080
      VITE_ALLOWED_HOSTS: static.128.216.108.65.clients.your-server.de,calorietracker-frontend-1
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      VITE_AUTH_MODE: ${AUTH_MODE:-dev}
    mem_limit: 1024m
    networks: [hermes]

volumes:
  pgdata: