apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: nutritrack
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: nutritrack/frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: GATEWAY_UPSTREAM
              value: gateway:8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: nutritrack
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
