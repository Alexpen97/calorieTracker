apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nutritrack-ingress
  namespace: nutritrack
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nutritrack.example.com
      secretName: nutritrack-tls
  rules:
    - host: nutritrack.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
