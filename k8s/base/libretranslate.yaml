apiVersion: apps/v1
kind: Deployment
metadata:
  name: libretranslate
  namespace: nutritrack
  labels:
    app: libretranslate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: libretranslate
  template:
    metadata:
      labels:
        app: libretranslate
    spec:
      containers:
        - name: libretranslate
          image: nutritrack/libretranslate:latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: LT_LOAD_ONLY
              value: en,nl
            - name: LT_UPDATE
              value: "true"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 90
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: libretranslate
  namespace: nutritrack
spec:
  selector:
    app: libretranslate
  ports:
    - port: 5000
      targetPort: 5000
