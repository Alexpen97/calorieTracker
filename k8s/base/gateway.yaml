apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: nutritrack
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: nutritrack/gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8080
            - name: USER_SERVICE_URL
              value: http://user-profile-service:8080
            - name: FOOD_SERVICE_URL
              value: http://food-catalog-service:8080
            - name: DIARY_SERVICE_URL
              value: http://diary-service:8080
            - name: NEVO_SERVICE_URL
              value: http://nevo-service:8080
            - name: RECO_SERVICE_URL
              value: http://recommendation-service:8080
            - name: JWKS_URI
              value: http://auth-service:8080/.well-known/jwks.json
            - name: CORS_ALLOWED_ORIGINS
              value: https://localhost,http://localhost:5173,http://localhost,http://localhost:8088,https://static.128.216.108.65.clients.your-server.de
            - name: SWAGGER_UI_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: nutritrack
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
