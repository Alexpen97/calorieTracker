spring:
  application:
    name: auth-service

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs

nutritrack:
  auth:
    mode: ${AUTH_MODE:dev}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    google-token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
    google-jwks-uri: ${GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
    issuer: ${JWT_ISSUER:http://auth-service}
    jwt-private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
    jwt-key-id: ${JWT_KEY_ID:nutritrack-1}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
    user-service-url: ${USER_SERVICE_URL:http://localhost:8082}
    internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
