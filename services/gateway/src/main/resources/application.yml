spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/.well-known/jwks.json
            - id: auth-api-docs
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api-docs/auth/**
              filters:
                - RewritePath=/api-docs/auth(?<segment>/?.*), /v3/api-docs$\{segment}
            - id: user-profile-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/users/**
            - id: user-api-docs
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api-docs/users/**
              filters:
                - RewritePath=/api-docs/users(?<segment>/?.*), /v3/api-docs$\{segment}
            - id: food-catalog-service
              uri: ${FOOD_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/products/**,/api/nutrients/**
            - id: food-api-docs
              uri: ${FOOD_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api-docs/food/**
              filters:
                - RewritePath=/api-docs/food(?<segment>/?.*), /v3/api-docs$\{segment}
            - id: diary-service
              uri: ${DIARY_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/diary/**
            - id: diary-api-docs
              uri: ${DIARY_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api-docs/diary/**
              filters:
                - RewritePath=/api-docs/diary(?<segment>/?.*), /v3/api-docs$\{segment}
            # recommendation-service is Phase 6 — omit until RECO_SERVICE_URL is required

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /api-docs/auth
      - name: user-profile-service
        url: /api-docs/users
      - name: food-catalog-service
        url: /api-docs/food
      - name: diary-service
        url: /api-docs/diary
  api-docs:
    enabled: false

nutritrack:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost,https://localhost}
  swagger-ui-enabled: ${SWAGGER_UI_ENABLED:true}
